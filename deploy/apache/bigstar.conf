# Replace ONLY the existing bigstar.conf after backing it up.
# Assumes the app listens on 127.0.0.1:3004 and web/dist is already built.
<VirtualHost *:80>
    ServerName www.kbigstar.kr
    ServerAlias kbigstar.kr
    DocumentRoot "/home/bitnami/projects/YoutubeMusicPlayer/web/dist"

    Alias /.well-known/acme-challenge/ "/opt/bitnami/apps/letsencrypt/.well-known/acme-challenge/"
    <Directory "/opt/bitnami/apps/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://www.kbigstar.kr%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.kbigstar.kr
    ServerAlias kbigstar.kr
    DocumentRoot "/home/bitnami/projects/YoutubeMusicPlayer/web/dist"

    SSLEngine on
    SSLCertificateFile "/opt/bitnami/letsencrypt/certificates/kbigstar.kr.crt"
    SSLCertificateKeyFile "/opt/bitnami/letsencrypt/certificates/kbigstar.kr.key"

    # Keep the existing ACME directory reachable on HTTPS too.
    Alias /.well-known/acme-challenge/ "/opt/bitnami/apps/letsencrypt/.well-known/acme-challenge/"
    <Directory "/opt/bitnami/apps/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    <Directory "/home/bitnami/projects/YoutubeMusicPlayer">
        AllowOverride None
        Require all denied
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyAddHeaders On
    # Discard externally supplied forwarding values; mod_proxy supplies client IP.
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 180
    LimitRequestBody 20971520

    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3004/ connectiontimeout=5 timeout=180
    ProxyPassReverse / http://127.0.0.1:3004/

    ErrorLog "/opt/bitnami/apache/logs/kbigstar-error.log"
    CustomLog "/opt/bitnami/apache/logs/kbigstar-access.log" combined
</VirtualHost>
